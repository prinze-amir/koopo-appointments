name: Plugin quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: PHP ${{ matrix.php }} static quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run plugin quality gate
        run: bash scripts/run-static-tests.sh
